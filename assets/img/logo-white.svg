<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" width="340" height="90" fill="none">
	<!-- Eye Icon on Left -->
	<g transform="translate(6, 10)">
		<!-- Outer Top Eyebrow / Lid curve (Light Cyan/Blue) -->
		<path d="M 6 36 C 14 14, 52 10, 80 24 C 74 18, 48 18, 16 32 C 10 34, 7 35, 6 36 Z" fill="#38bdf8" />

		<!-- Main Upper Blue Arc -->
		<path d="M 8 36 C 24 16, 70 14, 98 38 C 76 21, 30 22, 8 36 Z" fill="#38bdf8" />

		<!-- Lower Arc with flick tail -->
		<path d="M 24 45 C 44 64, 82 58, 106 36 C 98 46, 78 57, 44 55 C 32 54, 25 48, 24 45 Z" fill="#ffffff" />
		<path d="M 28 42 C 48 57, 80 54, 102 38 C 96 44, 76 52, 46 51 C 36 50, 30 46, 28 42 Z" fill="#38bdf8" opacity="0.8" />

		<!-- Outer Iris Circle -->
		<circle cx="56" cy="36" r="16" fill="#38bdf8" />
		<circle cx="56" cy="36" r="15" fill="#7dd3fc" />

		<!-- Middle Ring -->
		<circle cx="56" cy="36" r="12" fill="#0f172a" />
		<circle cx="56" cy="36" r="10.5" fill="#38bdf8" />

		<!-- Inner Pupil -->
		<circle cx="56" cy="36" r="7.5" fill="#ffffff" />

		<!-- Pupil Highlight -->
		<circle cx="53" cy="33" r="2.2" fill="#0f172a" />
	</g>

	<!-- Brand Typography on Right -->
	<text x="126" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Netrana</text>
	<text x="127" y="60" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#38bdf8" letter-spacing="0.2">Eye Hospital</text>
	<line x1="128" y1="69" x2="175" y2="69" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
	<text x="182" y="73" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.3">Sight for Life</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 68" width="320" height="68" fill="none">
	<defs>
		<linearGradient id="eyeBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#14539a" />
			<stop offset="100%" stop-color="#0b3058" />
		</linearGradient>
	</defs>

	<!-- Eye Emblem on Left -->
	<g transform="translate(4, 2)">
		<!-- Upper Blue Swoosh/Arch -->
		<path d="M 4 32 C 16 8, 64 6, 96 26 C 88 18, 56 14, 18 28 C 12 30, 6 31, 4 32 Z" fill="url(#eyeBlueGrad)" />
		<path d="M 6 32 C 24 14, 70 12, 98 32 C 76 19, 30 20, 6 32 Z" fill="#14539a" />

		<!-- Lower Dark Navy Eyelash Curve with flick tail -->
		<path d="M 20 38 C 38 56, 82 54, 108 30 C 98 42, 74 50, 40 48 C 28 47, 22 42, 20 38 Z" fill="#091b30" />
		<path d="M 24 36 C 42 50, 80 47, 102 32 C 94 39, 72 45, 42 44 C 32 43, 26 39, 24 36 Z" fill="#14539a" opacity="0.4" />

		<!-- Iris Layering -->
		<circle cx="56" cy="31" r="16.5" fill="#2563eb" />
		<circle cx="56" cy="31" r="15" fill="#3b82f6" />
		<circle cx="56" cy="31" r="12" fill="#ffffff" />
		<circle cx="56" cy="31" r="10" fill="#1d4ed8" />

		<!-- Dark Pupil -->
		<circle cx="56" cy="31" r="6.8" fill="#091b30" />

		<!-- Reflection highlight -->
		<circle cx="53" cy="28" r="2.4" fill="#ffffff" />
	</g>

	<!-- Brand Typography on Right (Compact, Sharp, High Contrast) -->
	<!-- Netrana -->
	<text x="124" y="28" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#091b30" letter-spacing="-0.5">Netrana</text>

	<!-- Eye Hospital -->
	<text x="125" y="48" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#1e5288" letter-spacing="0.2">Eye Hospital</text>

	<!-- Tagline Divider & Text -->
	<line x1="126" y1="56" x2="168" y2="56" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" />
	<text x="174" y="60" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#64748b" letter-spacing="0.3">Sight for Life</text>
</svg>
